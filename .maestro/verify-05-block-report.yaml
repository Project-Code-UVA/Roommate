appId: host.exp.Exponent
---
# Verify Phase 05 — Test 9: Block/Report from Chat
# PRE-REQUISITE: Authenticated user with at least one conversation thread.

# Launch Expo Go and open Room
- launchApp
- waitForAnimationToEnd
- tapOn:
    text: "Room"
    index: 0
    optional: true
- waitForAnimationToEnd

# Dismiss Expo dev tools popup if present
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd

# Dismiss swipe tutorial if present
- tapOn:
    text: "Tap to continue"
    optional: true
- waitForAnimationToEnd

# Wait for app to fully load
- extendedWaitUntil:
    visible:
        text: "Messages, tab.*"
    timeout: 30000

# Navigate to Messages tab
- tapOn:
    text: "Messages, tab.*"
- waitForAnimationToEnd

# Open first conversation
- tapOn:
    point: "50%,20%"
- waitForAnimationToEnd

# Verify chat screen loaded
- extendedWaitUntil:
    visible:
        id: "chat-header-back"
    timeout: 10000

# Tap overflow menu (three dots)
- tapOn:
    id: "chat-header-overflow"
- waitForAnimationToEnd

# Verify Block and Report options appear
- assertVisible:
    id: "chat-menu-block"
- assertVisible:
    id: "chat-menu-report"
- takeScreenshot: verify_05_overflow_options

# Tap Report to check categories appear
- tapOn:
    id: "chat-menu-report"
- waitForAnimationToEnd
- takeScreenshot: verify_05_report_categories

# Dismiss report sheet by tapping backdrop
- tapOn:
    point: "50%,10%"
    optional: true
- waitForAnimationToEnd

# Go back to thread list
- tapOn:
    id: "chat-header-back"
- waitForAnimationToEnd
- takeScreenshot: verify_05_back_after_overflow
