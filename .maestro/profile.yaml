appId: host.exp.Exponent
---
# Profile and Messages screens test

# Launch and open Room
- launchApp
- waitForAnimationToEnd
- tapOn:
    text: "Room"
    index: 0
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "COMPATIBLE"
    timeout: 30000

# Navigate to Profile tab
- tapOn:
    text: "Profile, tab.*"
- waitForAnimationToEnd
- assertVisible:
    id: "profile-title"
- assertVisible: "Coming Soon"
- takeScreenshot: profile_screen

# Navigate to Messages tab
- tapOn:
    text: "Messages, tab.*"
- waitForAnimationToEnd
- assertVisible:
    id: "messages-title"
- takeScreenshot: messages_screen
