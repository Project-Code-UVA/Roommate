appId: host.exp.Exponent
---
# Verify Phase 05 — Test 8: GIF Search and Send
# PRE-REQUISITE: Authenticated user with at least one conversation thread.

# Launch Expo Go and open Room
- launchApp
- waitForAnimationToEnd
- tapOn:
    text: "Room"
    index: 0
    optional: true
- waitForAnimationToEnd

# Dismiss Expo dev tools popup if present
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd

# Dismiss swipe tutorial if present
- tapOn:
    text: "Tap to continue"
    optional: true
- waitForAnimationToEnd

# Wait for app to fully load
- extendedWaitUntil:
    visible:
        text: "Messages, tab.*"
    timeout: 30000

# Navigate to Messages tab
- tapOn:
    text: "Messages, tab.*"
- waitForAnimationToEnd

# Open first conversation
- tapOn:
    point: "50%,20%"
- waitForAnimationToEnd

# Verify chat screen loaded
- extendedWaitUntil:
    visible:
        id: "chat-header-back"
    timeout: 10000

# Tap GIF button in composer
- tapOn:
    id: "composer-gif-btn"
- waitForAnimationToEnd

# Verify GIF search panel appeared
- assertVisible: "Search GIFs"
- assertVisible: "Powered by GIPHY"
- takeScreenshot: verify_05_gif_panel_open

# Search for a GIF
- tapOn: "Search GIFs"
- inputText: "hello"
- waitForAnimationToEnd
- takeScreenshot: verify_05_gif_search_results
