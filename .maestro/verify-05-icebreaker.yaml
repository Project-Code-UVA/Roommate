appId: host.exp.Exponent
---
# Verify Phase 05 — Test 5: Icebreaker Card
# PRE-REQUISITE: Authenticated user. Need a conversation that shows the icebreaker card.
# NOTE: Icebreaker card appears in new/empty conversations.

# Launch Expo Go and open Room
- launchApp
- waitForAnimationToEnd
- tapOn:
    text: "Room"
    index: 0
    optional: true
- waitForAnimationToEnd

# Dismiss Expo dev tools popup if present
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd

# Dismiss swipe tutorial if present
- tapOn:
    text: "Tap to continue"
    optional: true
- waitForAnimationToEnd

# Wait for app to fully load
- extendedWaitUntil:
    visible:
        text: "Messages, tab.*"
    timeout: 30000

# Navigate to Messages tab
- tapOn:
    text: "Messages, tab.*"
- waitForAnimationToEnd

# Open first conversation (should be new/empty to see icebreaker)
- tapOn:
    point: "50%,20%"
- waitForAnimationToEnd

# Verify chat screen loaded
- extendedWaitUntil:
    visible:
        id: "chat-header-back"
    timeout: 10000

# Check icebreaker card is visible with "Break the ice" header
- assertVisible: "Break the ice"
- takeScreenshot: verify_05_icebreaker_visible

# Tap "More" button to get new prompts
- tapOn:
    id: "icebreaker-more"
- waitForAnimationToEnd
- takeScreenshot: verify_05_icebreaker_more

# Dismiss the icebreaker card
- tapOn:
    id: "icebreaker-dismiss"
- waitForAnimationToEnd
- takeScreenshot: verify_05_icebreaker_dismissed
